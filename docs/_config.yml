# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Chappy.php User Guide
email: chad.chapman2010@gmail.com
description: >- # this means to ignore newlines until "baseurl:"
  User guide for the Chappy.php Model View Controller (MVC) framework
baseurl: "/chappy-php-starter" # the subpath of your site, e.g. /blog
url: "https://chapmancbvcu.github.io/" # the base hostname & protocol for your site, e.g. http://example.com
github_username:  chapmancbVCU

# Build settings
remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
  - jekyll-feed

# Just the Docs settings
color_scheme: light
search_enabled: true
search:
  heading_level: 3        # index ## and ### sections so results link to the section
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  rel_url: true
  button: false
  # Focus the search input by pressing `ctrl + focus_shortcut_key` (or `cmd + focus_shortcut_key` on macOS)
  focus_shortcut_key: 'k'
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"
aux_links:
  "API Reference": "https://chapmancbvcu.github.io/chappy-php-framework/"
  "Framework on GitHub": "https://github.com/chapmancbVCU/chappy-php-framework"
  "Starter App on GitHub": "https://github.com/chapmancbVCU/chappy-php-starter"
  "Just the Docs Theme" : "https://just-the-docs.github.io/just-the-docs/"
aux_links_new_tab: true
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/chapmancbVCU/chappy-php-starter"
gh_edit_branch: "main"
gh_edit_source: docs
gh_edit_view_mode: "tree"
footer_content: "Chappy.php is open source. Found a problem? Open an issue on GitHub."
favicon_ico: "/assets/images/noun-mvc-5340614.png"
# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/
# Ensure Jekyll serves Markdown files
include:
  - "*.md"

# Exclude unnecessary files
exclude:
  - "Gemfile"
  - "Gemfile.lock"
  - "README.md"
  - "vendor"
  - "node_modules"